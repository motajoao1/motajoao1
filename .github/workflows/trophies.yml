name: Atualizar Troféus do GitHub

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  update-trophies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        
      - name: Gerar Troféus
        uses: ryotako/github-profile-trophy-action@v1
        with:
          username: motajoao1
          theme: radical
          no-frame: true
          margin-w: 15
          output: trophies.svg
          
      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🏆 Atualizando troféus do perfil"
          file_pattern: "trophies.svg"
